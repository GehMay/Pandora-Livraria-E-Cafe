name: Manutenção do Supabase

# Mantém o projeto Supabase ativo (projetos free pausam após ~7 dias sem uso)
# e roda uma limpeza mensal no banco. Este workflow só usa SUPABASE_URL e
# SUPABASE_SERVICE_ROLE_KEY (veja database/SUPABASE.md). O secret
# SUPABASE_ANON_KEY fica guardado pra quando o app passar a falar com o
# Supabase de verdade (ela é a chave segura pra usar no front-end).
on:
  schedule:
    - cron: '0 6 * * *' # todo dia, pra manter ativo (antes era a cada 3 dias)
    - cron: '0 6 1 * *' # dia 1 de cada mês, pra limpeza
  workflow_dispatch: {} # permite rodar manualmente em Actions > Run workflow (testa os dois jobs)

jobs:
  manter-ativo:
    if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Pingar o Supabase
        run: |
          # O endpoint raiz /rest/v1/ (introspecção do schema) exige a secret key;
          # a publishable key não tem permissão pra isso, só pra acessar tabelas/RPCs
          # liberados por RLS. Por isso usamos a mesma chave do job de limpeza aqui.
          codigo=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/")
          echo "Status HTTP: $codigo"
          if [ "$codigo" -ge 400 ]; then exit 1; fi

  limpeza-mensal:
    if: github.event.schedule == '0 6 1 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Rodar limpeza mensal (função limpeza_mensal no banco)
        run: |
          codigo=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/limpeza_mensal")
          echo "Status HTTP: $codigo"
          if [ "$codigo" -ge 400 ]; then exit 1; fi
