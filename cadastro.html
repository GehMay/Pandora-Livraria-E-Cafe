<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Pandora Livraria & Café</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <canvas id="meuCanvas"></canvas>

    <header class="cabecalho">
        <a href="index.html" class="link-home">
            <p>Pandora Livraria & Café</p>
        </a>
        <nav class="cabecalho_nav">
            <p>Junte-se à nossa comunidade mágica</p>
        </nav>
    </header>

    <main class="container">
        <div class="form-container">
            <h2>Criar Conta</h2>
            <form action="#" method="POST">
                <div class="form-grupo">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" required placeholder="Seu nome bruxo">
                </div>
                <div class="form-grupo">
                    <label for="email">E-mail Bruxo</label>
                    <input type="email" id="email" name="email" required placeholder="bruxo@hogwarts.com">
                </div>
                <div class="form-grupo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required placeholder="Crie uma senha forte">
                </div>
                <button type="submit" class="btn-submit">Criar Conta Mágica</button>
            </form>
            <a href="login.html" class="form-link">Já tem uma conta? Entre aqui!</a>
        </div>
    </main>

    <footer class="rodape">
        <p>&copy; 2024 Pandora Livraria & Café - Todos os direitos reservados.</p>
    </footer>

    <script src="JS/magica.js"></script>
    <script src="JS/canvas.js"></script>
</body>
</html>
