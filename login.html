<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Pandora Livraria & Café</title>
    <link rel="icon" type="image/svg+xml" href="imagens/logo.svg">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <canvas id="meuCanvas"></canvas>
    
    <header class="cabecalho">
        <a href="index.html" class="cabecalho_logo" aria-label="Página inicial"><img src="imagens/logo.svg" alt="Logo Pandora Livraria & Café"></a>
        <a href="index.html" class="link-home">
            <p>Pandora Livraria & Café</p>
        </a>
        <nav class="cabecalho_nav">
            <p>Acesse sua conta mágica</p>
        </nav>
    </header>

    <main class="container">
        <div class="form-container">
            <h2>Entrar</h2>
            <form action="#" method="POST">
                <div class="form-grupo">
                    <label for="email">E-mail Bruxo</label>
                    <input type="email" id="email" name="email" required placeholder="bruxo@hogwarts.com">
                </div>
                <div class="form-grupo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required placeholder="Sua senha secreta">
                </div>
                <button type="submit" class="btn-submit">Acessar Cofre</button>
            </form>
            <a href="cadastro.html" class="form-link">Ainda não tem conta? Crie uma agora!</a>
        </div>
    </main>

    <footer class="rodape">
        <p>&copy; 2024 Pandora Livraria & Café - Todos os direitos reservados.</p>
    </footer>

    <script src="JS/magica.js"></script>
    <script src="JS/canvas.js"></script>
</body>
</html>
